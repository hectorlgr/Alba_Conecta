[project]
name = "albaconecta-backend"
version = "0.1.0"
description = "Backend Alba Conecta (CORPALIV) - API y identidad segura"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=44",
    "pwdlib[argon2]>=0.2",
    "alembic>=1.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Necesario para `pip install .` dentro de la imagen Docker.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["albaconecta_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
